<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hisaab — Onboarding, monthly income</title>
</head>
<body style="margin:0;padding:24px;background:#D3D0C8;display:flex;justify-content:center">
<main>

<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,400..700&amp;family=Mukta:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEECE6; color: #161615; font-family: 'Mukta', sans-serif; box-sizing: border-box; padding: 56px 20px 24px; display: flex; flex-direction: column">

  <div aria-label="Step 1 of 3" style="display: flex; gap: 6px; justify-content: center">
    <span style="width: 28px; height: 6px; border-radius: 3px; background: #161615"></span>
    <span style="width: 12px; height: 6px; border-radius: 3px; background: #D3D0C8"></span>
    <span style="width: 12px; height: 6px; border-radius: 3px; background: #D3D0C8"></span>
  </div>

  <h1 style="margin: 24px 0 0; font-family: 'Anek Latin', sans-serif; font-weight: 600; font-size: 30px; line-height: 34px; letter-spacing: -0.3px">How much money comes in each month?</h1>
  <span style="margin-top: 6px; font-size: 15px; color: #62615C; line-height: 20px">Your salary after tax. You can change it any time.</span>

  <div style="margin-top: 22px; display: flex; align-items: center; gap: 4px">
    <span style="font-family: 'Anek Latin', sans-serif; font-weight: 600; font-size: 64px; line-height: 64px; font-stretch: 85%; font-variation-settings: 'wdth' 85; letter-spacing: -0.6px; font-feature-settings: 'tnum'">₹45,000</span>
    <span style="width: 3px; height: 50px; border-radius: 2px; background: #161615"></span>
  </div>

  <div style="margin-top: 16px; border-radius: 22px; background: #FFFEFB; color: #161615; padding: 14px 16px">
    <span style="font-size: 15px; color: #62615C">That's about <b style="color: #161615; font-weight: 700; font-feature-settings: 'tnum'">₹1,500 a day</b></span>
    <div aria-hidden="true" style="margin-top: 10px; display: flex; gap: 3px; align-items: flex-end; height: 28px">
      <span style="flex: 1; height: 28px; border-radius: 4px; background: #FFB020; outline: 1.5px solid #161615; outline-offset: -1.5px"></span>
      <span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span>
      <span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span><span style="flex: 1; height: 28px; border-radius: 4px; background: #D3D0C8"></span>
      <span style="flex: 1; height: 20px; border-radius: 4px; background: #E4E1DA"></span><span style="flex: 1; height: 14px; border-radius: 4px; background: #E4E1DA"></span><span style="flex: 1; height: 9px; border-radius: 4px; background: #E4E1DA"></span><span style="flex: 1; height: 5px; border-radius: 3px; background: #E4E1DA"></span>
      <span style="flex: 6"></span>
    </div>
    <span style="display: block; margin-top: 8px; font-size: 13px; color: #62615C">One block for every day of the month</span>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">1</button>
    <button style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">2</button>
    <button style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">3</button>
    <button style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">4</button>
    <button style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">5</button>
    <button style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">6</button>
    <button style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">7</button>
    <button style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">8</button>
    <button style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">9</button>
    <button style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 23px; font-weight: 500">00</button>
    <button style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">0</button>
    <button aria-label="Delete last digit" style="height: 60px; border: 0; border-radius: 16px; background: #E4E1DA; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg>
    </button>
  </div>

  <a href="02-home.html" style="margin-top: 14px; height: 58px; border-radius: 18px; background: #FFB020; border: 1.5px solid #161615; box-shadow: 0 2px 0 #161615; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 21px; font-weight: 600">
    Next
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</div>
</main>
</body>
</html>
