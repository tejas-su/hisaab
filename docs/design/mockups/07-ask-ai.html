<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hisaab — Ask AI</title>
</head>
<body style="margin:0;padding:24px;background:#D3D0C8;display:flex;justify-content:center">
<main>

<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,400..700&amp;family=Mukta:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#161615}a:hover{color:#62615C}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEECE6; color: #161615; font-family: 'Mukta', sans-serif; box-sizing: border-box; padding: 52px 20px 28px; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 12px; height: 44px">
    <a href="06-spends.html" aria-label="Back to Spends" style="width: 44px; height: 44px; border-radius: 14px; background: #E4E1DA; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Anek Latin', sans-serif; font-weight: 600; font-size: 30px; line-height: 32px">Ask AI</h1>
  </div>

  <span style="margin-top: 16px; font-size: 17px; font-weight: 600; line-height: 22px">What do you want to know?</span>

  <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button aria-pressed="true" style="height: 88px; border-radius: 22px; border: 0; background: #161615; padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; position: relative; font-family: 'Mukta', sans-serif; text-align: left; color: #F2F1EC">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F1EC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span style="font-size: 15px; font-weight: 700; line-height: 19px">Review my month</span>
      <span style="position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 11px; background: #FFB020; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
      </span>
    </button>
    <button aria-pressed="false" style="height: 88px; border-radius: 22px; border: 1.5px solid #D3D0C8; background: #FFFEFB; padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; font-family: 'Mukta', sans-serif; text-align: left; color: #161615">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>
      <span style="font-size: 15px; font-weight: 700; line-height: 19px">Help me save</span>
    </button>
    <button aria-pressed="false" style="height: 88px; border-radius: 22px; border: 1.5px solid #D3D0C8; background: #FFFEFB; padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; font-family: 'Mukta', sans-serif; text-align: left; color: #161615">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>
      <span style="font-size: 15px; font-weight: 700; line-height: 19px">Make me a budget</span>
    </button>
    <button aria-pressed="false" style="height: 88px; border-radius: 22px; border: 1.5px solid #D3D0C8; background: #FFFEFB; padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; font-family: 'Mukta', sans-serif; text-align: left; color: #161615">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
      <span style="font-size: 15px; font-weight: 700; line-height: 19px">Am I on track?</span>
    </button>
  </div>
  <button aria-pressed="false" style="margin-top: 10px; height: 52px; border-radius: 18px; border: 1.5px solid #D3D0C8; background: #FFFEFB; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 700; color: #161615">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10h6"/></svg>
    Ask my own question
  </button>

  <div role="radiogroup" aria-label="Period" style="margin-top: 16px; display: flex; gap: 8px">
    <button role="radio" aria-checked="true" style="height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: #161615; color: #F2F1EC; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 700">This month</button>
    <button role="radio" aria-checked="false" style="height: 40px; padding: 0 16px; border: 1.5px solid #D3D0C8; border-radius: 12px; background: transparent; color: #161615; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 600">Last 3 months</button>
  </div>

  <div style="margin-top: 14px; border-radius: 20px; background: #E4E1DA; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 19px; color: #161615">
    <span style="font-size: 12px; font-weight: 700; color: #62615C; margin-bottom: 2px">What will be sent · 142 entries</span>
    <span>You are a friendly money coach. Use numbers, no jargon.</span>
    <span>Income ₹45,000/month · payday 4th · INR</span>
    <span>Spent ₹27,570: Food 9,840 · Bills 8,200 · Travel 4,100…</span>
    <span style="color: #62615C">Task: review my month — 3 problems, 3 savings…</span>
    <a href="#" style="margin-top: 4px; font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; padding: 4px 0">Show full text</a>
  </div>

  <label style="margin-top: 8px; display: flex; align-items: center; justify-content: space-between; height: 44px; font-size: 15px; font-weight: 600">
    Hide my notes
    <span role="switch" aria-checked="false" style="width: 50px; height: 30px; border-radius: 15px; background: #E4E1DA; box-shadow: inset 0 0 0 1.5px #D3D0C8; display: flex; align-items: center; padding: 0 4px; box-sizing: border-box">
      <span style="width: 22px; height: 22px; border-radius: 11px; background: #62615C"></span>
    </span>
  </label>

  <div style="flex-grow: 1"></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button style="height: 46px; border-radius: 16px; border: 1.5px solid #D3D0C8; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 700; color: #161615">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.5M8.2 13.2l7.6 4.5"/></svg>
      Other AI
    </button>
    <button style="height: 46px; border-radius: 16px; border: 1.5px solid #D3D0C8; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 700; color: #161615">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
      Copy only
    </button>
  </div>

  <button style="margin-top: 12px; height: 58px; border-radius: 18px; background: #FFB020; border: 1.5px solid #161615; box-shadow: 0 2px 0 #161615; display: flex; align-items: center; justify-content: center; gap: 8px; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 20px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
    Copy &amp; open ChatGPT
  </button>
</div>
</main>
</body>
</html>
