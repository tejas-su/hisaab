<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hisaab — Add, step 1 amount</title>
</head>
<body style="margin:0;padding:24px;background:#DAD8D1;display:flex;justify-content:center">
<main>

<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,400..700&amp;family=Mukta:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F5F1; color: #161615; font-family: 'Mukta', sans-serif">

  <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 52px; height: 120px; border-radius: 28px; background: #161615; padding: 18px 20px; box-sizing: border-box">
    <span style="font-family: 'Anek Latin', sans-serif; font-weight: 600; font-size: 40px; font-stretch: 85%; font-variation-settings: 'wdth' 85; color: #F2F1EC">₹1,430</span>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(22, 22, 21, 0.32)"></div>

  <section aria-label="Add an expense" style="position: absolute; left: 0; right: 0; top: 96px; bottom: 0; background: #FCFBF8; border-radius: 36px 36px 0 0; padding: 10px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #DAD8D1"></span>

    <div role="radiogroup" aria-label="Money out or in" style="margin-top: 16px; align-self: center; display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: #ECEAE4">
      <button role="radio" aria-checked="true" style="width: 112px; height: 40px; border: 0; border-radius: 12px; background: #161615; color: #F2F1EC; font-family: 'Mukta', sans-serif; font-size: 16px; font-weight: 700">Spent</button>
      <button role="radio" aria-checked="false" style="width: 112px; height: 40px; border: 0; border-radius: 12px; background: transparent; color: #62615C; font-family: 'Mukta', sans-serif; font-size: 16px; font-weight: 600">Got</button>
    </div>

    <div style="margin-top: 30px; display: flex; align-items: center; justify-content: center; gap: 4px">
      <span style="font-family: 'Anek Latin', sans-serif; font-weight: 600; font-size: 64px; line-height: 64px; font-stretch: 85%; font-variation-settings: 'wdth' 85; letter-spacing: -0.6px; font-feature-settings: 'tnum'">₹2,450</span>
      <span style="width: 3px; height: 50px; border-radius: 2px; background: #161615"></span>
    </div>
    <span style="align-self: center; margin-top: 6px; font-size: 15px; color: #62615C; line-height: 20px">₹1,020 over today's share · tomorrow ₹1,722</span>

    <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <button style="height: 40px; border-radius: 12px; border: 1.5px solid #DAD8D1; background: transparent; color: #161615; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 700; font-feature-settings: 'tnum'">+₹10</button>
      <button style="height: 40px; border-radius: 12px; border: 1.5px solid #DAD8D1; background: transparent; color: #161615; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 700; font-feature-settings: 'tnum'">+₹20</button>
      <button style="height: 40px; border-radius: 12px; border: 1.5px solid #DAD8D1; background: transparent; color: #161615; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 700; font-feature-settings: 'tnum'">+₹50</button>
      <button style="height: 40px; border-radius: 12px; border: 1.5px solid #DAD8D1; background: transparent; color: #161615; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 700; font-feature-settings: 'tnum'">+₹100</button>
      <button style="height: 40px; border-radius: 12px; border: 1.5px solid #DAD8D1; background: transparent; color: #161615; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 700; font-feature-settings: 'tnum'">+₹500</button>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="height: 64px; border: 0; border-radius: 16px; background: #ECEAE4; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">1</button>
      <button style="height: 64px; border: 0; border-radius: 16px; background: #ECEAE4; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">2</button>
      <button style="height: 64px; border: 0; border-radius: 16px; background: #ECEAE4; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">3</button>
      <button style="height: 64px; border: 0; border-radius: 16px; background: #ECEAE4; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">4</button>
      <button style="height: 64px; border: 0; border-radius: 16px; background: #DAD8D1; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500; transform: scale(0.97)">5</button>
      <button style="height: 64px; border: 0; border-radius: 16px; background: #ECEAE4; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">6</button>
      <button style="height: 64px; border: 0; border-radius: 16px; background: #ECEAE4; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">7</button>
      <button style="height: 64px; border: 0; border-radius: 16px; background: #ECEAE4; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">8</button>
      <button style="height: 64px; border: 0; border-radius: 16px; background: #ECEAE4; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">9</button>
      <button style="height: 64px; border: 0; border-radius: 16px; background: #ECEAE4; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 23px; font-weight: 500">00</button>
      <button style="height: 64px; border: 0; border-radius: 16px; background: #ECEAE4; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 27px; font-weight: 500">0</button>
      <button aria-label="Delete last digit. Long-press to clear" style="height: 64px; border: 0; border-radius: 16px; background: #ECEAE4; display: flex; align-items: center; justify-content: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg>
      </button>
    </div>

    <a href="04-add-category.html" style="margin-top: 14px; height: 58px; border-radius: 18px; background: #FFB020; border: 1.5px solid #161615; box-shadow: 0 2px 0 #161615; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #161615; font-family: 'Anek Latin', sans-serif; font-size: 21px; font-weight: 600">
      Next
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#161615" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </section>
</div>
</main>
</body>
</html>
