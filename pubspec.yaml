name: expense_tracker
description: "hisaab• — how much can I safely spend today? An offline expense tracker for India."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  fpdart: ^1.2.0
  get_it: ^9.3.0
  hugeicons: ^1.2.0
  intl: ^0.20.3
  path: ^1.9.1
  share_plus: ^13.3.1
  sqflite: ^2.4.5
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL-AnekLatin.txt
    - assets/fonts/OFL-Mukta.txt
    - assets/illustrations/

  fonts:
    - family: AnekLatin
      fonts:
        - asset: assets/fonts/AnekLatin-Variable.ttf
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
